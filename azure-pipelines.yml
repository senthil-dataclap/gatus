trigger:
  - main  # Adjust based on your branch

pool:
  vmImage: "ubuntu-latest"

steps:
  # Install Azure CLI (if not available)
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.x"

  - task: AzureCLI@2
    displayName: "Pull Docker Image and Scan with Trivy on Azure VM"
    inputs:
      azureSubscription: "CICD-Demo-Service-Connection"  # Replace with your service connection
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        # SSH into the VM and execute commands
        az vm run-command invoke \
          --resource-group CICD-demo-vm_group \
          --name CICD-demo-vm \
          --command-id RunShellScript \
          --scripts '
            echo "Pulling Docker image from Docker Hub..."
            docker pull arasu35/gatus:latest

            echo "Running Trivy scan..."
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp:/tmp aquasec/trivy image --format template --template @contrib/html.tpl -o /home/azureuser/nginx/html/trivy-report.html arasu35/gatus:latest

