trigger:
- Azure-main

pool:
  vmImage: ubuntu-latest

variables:
- group: CICD-Demo-var-group  # Link the variable group

steps:
#  Checkout Code from GitHub
- checkout: self
  displayName: "Checkout GitHub repository"

#  Login to Docker Hub
- script: |
    set -e  
    echo "Logging in to Docker Hub..."
    echo $(DOCKER_PASSWORD) | docker login -u arasu35 --password-stdin
    docker info  # Verify login success
  displayName: "Login to Docker Hub"

#  Build Docker Image
- script: |
    set -e
    echo "Building the Docker image..."
    docker build -t arasu35/gatus-azure:latest -f ./Dockerfile .
    docker images
  displayName: "Build Docker Image"

#  Push Image to Docker Hub
- script: |
    echo "Tagging and pushing to Docker Hub..."
    docker push arasu35/gatus-azure:latest
  displayName: "Push Docker Image to Docker Hub"

#  Pull Image on Azure VM and Run Trivy Scan
- task: AzureCLI@2
  displayName: "Pull Docker Image & Run Trivy Scan"
  inputs:
    azureSubscription: "CICD-Demo-Service-Connection"
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az vm run-command invoke \
        --resource-group CICD-demo-vm_group \
        --name CICD-demo-vm \
        --command-id RunShellScript \
        --scripts '
          echo "$(DOCKER_PASSWORD)" | docker login -u arasu35 --password-stdin;
          docker pull arasu35/gatus-azure:latest;

          # Ensure the Nginx HTML directory exists
          mkdir -p /home/azureuser/nginx/html;

          # Run Trivy scan and store the HTML report in the Nginx HTML directory
          docker run --rm -v /home/azureuser/nginx/html:/output aquasec/trivy image \
            --format template --template "https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl" \
            -o /output/trivy-report.html arasu35/gatus-azure:latest;

          # Restart Nginx to reflect the new report
          docker restart nginx-reverse-proxy;
        '
