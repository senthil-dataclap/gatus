trigger:
  - Azure-main

pool:
  vmImage: ubuntu-latest

steps:
# Step 1: Wait to avoid conflicts
- script: sleep 30
  displayName: "Wait before running command"

# Step 2: Change to project directory
- task: AzureCLI@2
  displayName: "Change to project directory"
  inputs:
    azureSubscription: "CICD-Demo-Service-Connection"
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az vm run-command invoke \
        --resource-group CICD-demo-vm_group \
        --name CICD-demo-vm \
        --command-id RunShellScript \
        --scripts 'cd /home/azureuser/gatus'

# Step 3: Checkout branch
- task: AzureCLI@2
  displayName: "Checkout Azure-main branch"
  inputs:
    azureSubscription: "CICD-Demo-Service-Connection"
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az vm run-command invoke \
        --resource-group CICD-demo-vm_group \
        --name CICD-demo-vm \
        --command-id RunShellScript \
        --scripts 'git checkout Azure-main'

# Step 4: Pull latest code
- task: AzureCLI@2
  displayName: "Git Pull Latest Code"
  inputs:
    azureSubscription: "CICD-Demo-Service-Connection"
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az vm run-command invoke \
        --resource-group CICD-demo-vm_group \
        --name CICD-demo-vm \
        --command-id RunShellScript \
        --scripts 'git pull origin Azure-main'
