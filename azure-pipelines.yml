trigger:
  - Azure-main

pool:
  vmImage: ubuntu-latest

variables:
  - group: CICD-Demo-var-group  # Link the variable group

steps:
#  Git Pull the latest code inside the Azure VM
- task: AzureCLI@2
  displayName: "Git Pull Latest Code on Azure VM"
  inputs:
    azureSubscription: "CICD-Demo-Service-Connection"
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      # Function to wait until no other run-command is running
      wait_for_run_command() {
        while az vm run-command list \
          --resource-group CICD-demo-vm_group \
          --vm-name CICD-demo-vm \
          --query "[?status=='Running']" | grep -q "Running"; do
          echo "Another run-command is in progress. Waiting 10 seconds..."
          sleep 10
        done
      }

      echo "Waiting for previous command to finish..."
      wait_for_run_command

      echo "Executing Git Pull command..."
      az vm run-command invoke \
        --resource-group CICD-demo-vm_group \
        --name CICD-demo-vm \
        --command-id RunShellScript \
        --scripts '
          cd /home/azureuser/gatus;
          git checkout Azure-main;
          git pull origin Azure-main;
        '

#  Build Docker Image inside the Azure VM
- task: AzureCLI@2
  displayName: "Build Docker Image inside Azure VM"
  inputs:
    azureSubscription: "CICD-Demo-Service-Connection"
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az vm run-command invoke \
        --resource-group CICD-demo-vm_group \
        --name CICD-demo-vm \
        --command-id RunShellScript \
        --scripts '
          cd /home/azureuser/gatus;
          docker build -t gatus-azure:latest -f ./Dockerfile .;
        '

#  Run Trivy Scan and Generate Report inside Azure VM
- task: AzureCLI@2
  displayName: "Run Trivy Scan & Generate HTML Report"
  inputs:
    azureSubscription: "CICD-Demo-Service-Connection"
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Checking if any previous run-command is still executing..."

      # Loop to wait until no 'Running' command is found
      while az vm run-command list \
        --resource-group CICD-demo-vm_group \
        --vm-name CICD-demo-vm \
        --query "[?status=='Running']" | grep -q 'Running'; do
        echo "Previous run-command execution still in progress... waiting 10 seconds"
        sleep 10
      done

      echo "No active run-command found. Proceeding with Trivy Scan."

      az vm run-command invoke \
        --resource-group CICD-demo-vm_group \
        --name CICD-demo-vm \
        --command-id RunShellScript \
        --scripts '
          mkdir -p /home/azureuser/nginx/html;
          echo "$(DOCKER_PASSWORD)" | docker login -u arasu35 --password-stdin;
          docker run --rm -v /home/azureuser/nginx/html:/output aquasec/trivy image --format template --template "@contrib/html.tpl" -o /output/trivy-report.html gatus-azure:latest;
          docker restart nginx-reverse-proxy;
        '

        '
