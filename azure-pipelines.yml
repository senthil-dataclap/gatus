trigger:
- Azure-main

pool:
  vmImage: ubuntu-latest

variables:
- group: CICD-Demo-var-group  # Link the variable group

steps:
# Checkout Code from GitHub
- checkout: self
  displayName: "Checkout GitHub repository"

# Login to Docker (Optional if you don't need to push)
- script: |
    echo $(DOCKER_PASSWORD) | docker login -u arasu35 --password-stdin
  displayName: "Login to Docker Hub"

# Build Docker Image in Pipeline
- script: |
    echo "Building the Docker image..."
    docker build -t gatus-local:latest -f ./Dockerfile .
  displayName: "Build Docker Image in Pipeline"

# Save the Docker Image as a tar file
- script: |
    echo "Saving the image as a tar file..."
    docker save -o gatus-image.tar gatus-local
  displayName: "Save Docker Image as TAR file"
  
# copy image to vm
- script: |
    echo "Copying Docker image to Azure VM..."
    scp -o StrictHostKeyChecking=no gatus-image.tar azureuser@4.240.5.161:/home/azureuser/doc-images/gatus-image.tar
  displayName: "Copy Docker Image to Azure VM"