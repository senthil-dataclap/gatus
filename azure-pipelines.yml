trigger:
  - Azure-main

pool:
  vmImage: ubuntu-latest

variables:
  - group: CICD-Demo-var-group  # Link the variable group

steps:
# Step 1: Wait before running any command (to avoid Azure conflicts)
- script: sleep 5
  displayName: "Wait before running commands"

# Step 2: Checkout branch
- task: AzureCLI@2
  displayName: "Checkout Azure-main branch"
  inputs:
    azureSubscription: "CICD-Demo-Service-Connection"
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az vm run-command invoke \
        --resource-group CICD-demo-vm_group \
        --name CICD-demo-vm \
        --command-id RunShellScript \
        --scripts 'git checkout Azure-main'

# Step 3: Wait before pulling the latest code
- script: sleep 5
  displayName: "Wait before Git Pull"

# Step 4: Pull latest code
- task: AzureCLI@2
  displayName: "Git Pull Latest Code"
  inputs:
    azureSubscription: "CICD-Demo-Service-Connection"
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az vm run-command invoke \
        --resource-group CICD-demo-vm_group \
        --name CICD-demo-vm \
        --command-id RunShellScript \
        --scripts 'git pull origin Azure-main'

# Step 5: Wait before Docker build to ensure files are updated
- script: sleep 5
  displayName: "Wait before Docker Build"

# Step 6: Build Docker Image inside the Azure VM
- task: AzureCLI@2
  displayName: "Build Docker Image inside Azure VM"
  inputs:
    azureSubscription: "CICD-Demo-Service-Connection"
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az vm run-command invoke \
        --resource-group CICD-demo-vm_group \
        --name CICD-demo-vm \
        --command-id RunShellScript \
        --scripts '
          cd /home/azureuser/gatus;
          docker build -t gatus-azure:latest -f ./Dockerfile .;'
        
# Step 7: Wait before Docker build to ensure files are updated
- script: sleep 5
  displayName: "Wait before Docker Build"
  
# Step 8:  Run Trivy Scan and Generate Report inside Azure VM
- task: AzureCLI@2
  displayName: "Run Trivy Scan & Generate HTML Report"
  inputs:
    azureSubscription: "CICD-Demo-Service-Connection"
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az vm run-command invoke \
        --resource-group CICD-demo-vm_group \
        --name CICD-demo-vm \
        --command-id RunShellScript \
        --scripts '
    
          echo "$(DOCKER_PASSWORD)" | docker login -u arasu35 --password-stdin;
          docker run --rm -v /home/azureuser/nginx/html:/output aquasec/trivy image --format template --template "@contrib/html.tpl" -o /output/trivy-report.html gatus-azure:latest;
          docker restart nginx-reverse-proxy; '

# Step 9: Wait before trivy scan completed
- script: sleep 5
  displayName: "Wait before trivy scan completed"
