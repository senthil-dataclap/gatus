trigger:
- Azure-main

pool:
  vmImage: ubuntu-latest

variables:
- group: CICD-Demo-var-group  # Link the variable group

steps:
#  Checkout Code from GitHub
- checkout: self
  displayName: "Checkout GitHub repository"

#  Login to Docker Hub
- script: |
    set -e  
    echo "Logging in to Docker Hub..."
    echo $(DOCKER_PASSWORD) | docker login -u arasu35 --password-stdin
    docker info  # Verify login success
  displayName: "Login to Docker Hub"

#  Build Docker Image
- script: |
    set -e
    echo "Building the Docker image..."
    docker build -t arasu35/gatus-azure:latest -f ./Dockerfile .
    docker images
  displayName: "Build Docker Image"

#  Push Image to Docker Hub
- script: |
    echo "Tagging and pushing to Docker Hub..."
    docker push arasu35/gatus-azure:latest
  displayName: "Push Docker Image to Docker Hub"

# Pull Docker Image and Scan with Trivy on Azure VM
- task: AzureCLI@2
  displayName: "Run Trivy Scan Inside Azure VM"
  inputs:
    azureSubscription: "CICD-Demo-Service-Connection"
    scriptType: "bash"
    scriptLocation: "inlineScript"
    inlineScript: |
      echo "Running Trivy scan inside Azure VM..."
      az vm run-command invoke \
        --resource-group CICD-demo-vm_group \
        --name CICD-demo-vm \
        --command-id RunShellScript \
        --scripts @- <<EOF
          set -e
          echo "Pulling latest Docker image from Docker Hub..."
          docker pull arasu35/gatus-azure:latest

          echo "Installing Trivy if not installed..."
          if ! command -v trivy &> /dev/null; then
            echo "Trivy not found, installing..."
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          fi

          echo "Downloading Trivy HTML template..."
          wget -O /home/azureuser/html.tpl https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl

          echo "Running Trivy scan on the image..."
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp:/tmp aquasec/trivy image --format template --template /home/azureuser/html.tpl -o /home/azureuser/nginx/html/trivy-report.html arasu35/gatus-azure:latest

          echo "Restarting Nginx to serve the updated report..."
          docker restart nginx-reverse-proxy || echo "Nginx container not found."

          echo "Trivy scan complete! Report available at: http://YOUR_AZURE_VM_IP/trivy-report.html"
      EOF
